services:
  - type: web
    name: applypilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /ready

    envVars:
      - key: APPLYPILOT_ENV
        value: production

      - key: APPLYPILOT_DATABASE_URL
        fromDatabase:
          name: applypilot-db
          property: connectionString

      - key: APPLYPILOT_SECRET_KEY
        generateValue: true

      - key: APPLYPILOT_CORS_ORIGIN_REGEX
        sync: false

      - key: APPLYPILOT_AI_PROVIDER
        value: none

databases:
  - name: applypilot-db
    plan: free